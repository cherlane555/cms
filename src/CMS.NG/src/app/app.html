<!-- Global toast: server-error messages raised by the HTTP interceptor. -->
<p-toast position="top-right" />

@if (isAuthenticated()) {
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo"><i class="pi pi-box"></i></span>
        <span class="name">{{ brand }}</span>
      </div>

      <nav class="menu">
        @for (group of navGroups(); track group.label) {
          <div class="nav-group">
            <button
              type="button"
              class="group-header"
              [class.open]="expanded() === group.label"
              (click)="toggle(group.label)"
            >
              <i [class]="group.icon"></i>
              <span class="label">{{ group.label }}</span>
              <i class="pi chevron" [class.pi-angle-down]="expanded() === group.label"
                 [class.pi-angle-right]="expanded() !== group.label"></i>
            </button>

            @if (expanded() === group.label && group.items.length) {
              <div class="group-items">
                @for (item of group.items; track item.label) {
                  @if (item.route) {
                    <a
                      class="nav-item"
                      [routerLink]="item.route"
                      routerLinkActive="active"
                    >
                      <i class="pi pi-id-card"></i>
                      <span>{{ item.label }}</span>
                    </a>
                  } @else {
                    <span class="nav-item disabled">
                      <i class="pi pi-user"></i>
                      <span>{{ item.label }}</span>
                    </span>
                  }
                }
              </div>
            }
          </div>
        }
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="spacer"></div>
        <div class="user-box">
          <a class="user-link" routerLink="/profile" title="我的個人資料 My Profile">
            <i class="pi pi-user"></i>
            <span class="user-name">{{ userName() }}</span>
          </a>
          <p-button
            type="button"
            label="登出 Logout"
            icon="pi pi-sign-out"
            severity="secondary"
            size="small"
            [text]="true"
            (onClick)="logout()"
          />
        </div>
      </header>

      <div class="content-body">
        <router-outlet />
      </div>
    </main>
  </div>
} @else {
  <router-outlet />
}
