<p-toast />

<form [formGroup]="form" (ngSubmit)="save()" class="page">
  <div class="page-header">
    <h2>{{ isEdit() ? '編輯發布狀態' : '新增發布狀態' }}</h2>
    <div class="actions">
      <!-- pkid is only fixed in edit mode; a new record has no history yet. -->
      <app-row-audit-badge tableName="PublishStatus" [pkid]="isEdit() ? form.controls.pkid.value : 0" />
      <p-button
        label="取消"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        type="button"
        (onClick)="cancel()"
      />
      <p-button
        label="儲存"
        icon="pi pi-check"
        severity="success"
        type="submit"
        [loading]="saving()"
      />
    </div>
  </div>

  <p-card>
    <ng-template pTemplate="title">發布狀態資料</ng-template>

    <div class="form-grid">
      <div class="field">
        <label for="pkid">主代碼 <span class="req">*</span></label>
        <p-inputNumber
          inputId="pkid"
          formControlName="pkid"
          [useGrouping]="false"
          [min]="1"
          [max]="255"
        />
        @if (form.controls.pkid.invalid && form.controls.pkid.touched) {
          <small class="error">主代碼為必填（1–255）</small>
        }
      </div>

      <div class="field">
        <label for="description">狀態描述 <span class="req">*</span></label>
        <input id="description" type="text" pInputText formControlName="description" maxlength="50" />
        @if (form.controls.description.invalid && form.controls.description.touched) {
          <small class="error">狀態描述為必填</small>
        }
      </div>

      <div class="field-check">
        <p-checkbox inputId="isDraft" formControlName="isDraft" [binary]="true" />
        <label for="isDraft">草稿</label>
      </div>

      <div class="field-check">
        <p-checkbox inputId="isPublished" formControlName="isPublished" [binary]="true" />
        <label for="isPublished">已發布</label>
      </div>

      <div class="field-check">
        <p-checkbox inputId="isDiscontinued" formControlName="isDiscontinued" [binary]="true" />
        <label for="isDiscontinued">已停用</label>
      </div>
    </div>
  </p-card>
</form>
