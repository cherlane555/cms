<p-toast />
<p-confirmDialog />

<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div class="title">
      <h2>發布狀態 PublishStatus</h2>
      <span class="subtitle">內容發布狀態代碼</span>
    </div>
    <div class="actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="filterOpen.set(true)"
      />
      <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <p-table
      [value]="statuses()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      [rowsPerPageOptions]="[10, 20, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      [sortField]="sortField"
      [sortOrder]="sortOrder"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      dataKey="pkid"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="pkid" style="width: 8rem">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="description">狀態描述 <p-sortIcon field="description" /></th>
          <th pSortableColumn="isDraft" style="width: 8rem">草稿 <p-sortIcon field="isDraft" /></th>
          <th pSortableColumn="isPublished" style="width: 8rem">
            已發布 <p-sortIcon field="isPublished" />
          </th>
          <th pSortableColumn="isDiscontinued" style="width: 8rem">
            已停用 <p-sortIcon field="isDiscontinued" />
          </th>
          <th style="width: 10rem">操作</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-status>
        <tr>
          <td>{{ status.pkid }}</td>
          <td>{{ status.description }}</td>
          <td>
            <p-tag [value]="status.isDraft ? '是' : '否'" [severity]="status.isDraft ? 'success' : 'secondary'" />
          </td>
          <td>
            <p-tag [value]="status.isPublished ? '是' : '否'" [severity]="status.isPublished ? 'success' : 'secondary'" />
          </td>
          <td>
            <p-tag [value]="status.isDiscontinued ? '是' : '否'" [severity]="status.isDiscontinued ? 'success' : 'secondary'" />
          </td>
          <td>
            <div class="row-actions">
              <p-button
                icon="pi pi-eye"
                severity="secondary"
                [text]="true"
                pTooltip="檢視"
                (onClick)="view(status)"
              />
              <p-button
                icon="pi pi-pencil"
                severity="info"
                [text]="true"
                pTooltip="編輯"
                (onClick)="edit(status)"
              />
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                pTooltip="刪除"
                (onClick)="remove(status)"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="empty">查無資料</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Filter drawer -->
<p-drawer
  [visible]="filterOpen()"
  (visibleChange)="filterOpen.set($event)"
  position="right"
  header="搜尋條件"
  [style]="{ width: '24rem' }"
>
  <div class="filter-form">
    <div class="field">
      <label for="keyword">關鍵字</label>
      <input
        id="keyword"
        type="text"
        pInputText
        [(ngModel)]="filter.keyword"
        placeholder="狀態描述"
      />
    </div>
    <div class="field">
      <label for="isDraft">草稿</label>
      <p-select
        inputId="isDraft"
        [(ngModel)]="filter.isDraft"
        [options]="triStateOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="isPublished">已發布</label>
      <p-select
        inputId="isPublished"
        [(ngModel)]="filter.isPublished"
        [options]="triStateOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="isDiscontinued">已停用</label>
      <p-select
        inputId="isDiscontinued"
        [(ngModel)]="filter.isDiscontinued"
        [options]="triStateOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>
    <div class="filter-actions">
      <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilter()" />
      <p-button label="查詢" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </div>
</p-drawer>
