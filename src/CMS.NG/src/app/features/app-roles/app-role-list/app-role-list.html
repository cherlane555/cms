<p-toast />
<p-confirmDialog />

<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div class="title">
      <h2>角色 AppRole</h2>
      <span class="subtitle">使用者角色</span>
    </div>
    <div class="actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="filterOpen.set(true)"
      />
      <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <p-table
      [value]="roles()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      [rowsPerPageOptions]="[10, 20, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      [sortField]="sortField"
      [sortOrder]="sortOrder"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      dataKey="roleId"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="pkid" style="width: 8rem">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
          <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
          <th pSortableColumn="permissionLevel" style="width: 10rem">
            權限等級 <p-sortIcon field="permissionLevel" />
          </th>
          <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
          <th pSortableColumn="userCount" style="width: 8rem">
            使用者數 <p-sortIcon field="userCount" />
          </th>
          <th style="width: 10rem">操作</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-role>
        <tr>
          <td>{{ role.pkid }}</td>
          <td>{{ role.roleId }}</td>
          <td>{{ role.roleName }}</td>
          <td>{{ role.permissionLevel }}</td>
          <td>{{ role.description }}</td>
          <td>{{ role.userCount }}</td>
          <td>
            <div class="row-actions">
              <p-button
                icon="pi pi-eye"
                severity="secondary"
                [text]="true"
                pTooltip="檢視"
                (onClick)="view(role)"
              />
              <p-button
                icon="pi pi-pencil"
                severity="info"
                [text]="true"
                pTooltip="編輯"
                (onClick)="edit(role)"
              />
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                pTooltip="刪除"
                (onClick)="remove(role)"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="empty">查無資料</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Filter drawer -->
<p-drawer
  [visible]="filterOpen()"
  (visibleChange)="filterOpen.set($event)"
  position="right"
  header="搜尋條件"
  [style]="{ width: '24rem' }"
>
  <div class="filter-form">
    <div class="field">
      <label for="keyword">關鍵字</label>
      <input
        id="keyword"
        type="text"
        pInputText
        [(ngModel)]="filter.keyword"
        placeholder="角色代碼 / 名稱 / 描述"
      />
    </div>
    <div class="field">
      <label for="permissionLevel">權限等級</label>
      <p-inputNumber
        inputId="permissionLevel"
        [(ngModel)]="filter.permissionLevel"
        [useGrouping]="false"
        placeholder="不限"
      />
    </div>
    <div class="filter-actions">
      <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilter()" />
      <p-button label="查詢" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </div>
</p-drawer>
