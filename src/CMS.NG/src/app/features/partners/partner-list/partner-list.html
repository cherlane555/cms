<p-toast />
<p-confirmDialog />

<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div class="title">
      <h2>合作廠商 Partner</h2>
      <span class="subtitle">訓練合作廠商</span>
    </div>
    <div class="actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="filterOpen.set(true)"
      />
      <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <p-table
      [value]="partners()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      [rowsPerPageOptions]="[10, 20, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      [sortField]="sortField"
      [sortOrder]="sortOrder"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      dataKey="pkid"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="pkid" style="width: 8rem">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="name">廠商名稱 <p-sortIcon field="name" /></th>
          <th pSortableColumn="appKey" style="width: 10rem">關鍵字 <p-sortIcon field="appKey" /></th>
          <th pSortableColumn="nameOnPartnerMenu">選單顯示名稱 <p-sortIcon field="nameOnPartnerMenu" /></th>
          <th pSortableColumn="displayOrder" style="width: 8rem">
            顯示順序 <p-sortIcon field="displayOrder" />
          </th>
          <th style="width: 10rem">操作</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-partner>
        <tr>
          <td>{{ partner.pkid }}</td>
          <td>{{ partner.name }}</td>
          <td>{{ partner.appKey }}</td>
          <td>{{ partner.nameOnPartnerMenu }}</td>
          <td>{{ partner.displayOrder }}</td>
          <td>
            <div class="row-actions">
              <p-button
                icon="pi pi-eye"
                severity="secondary"
                [text]="true"
                pTooltip="檢視"
                (onClick)="view(partner)"
              />
              <p-button
                icon="pi pi-pencil"
                severity="info"
                [text]="true"
                pTooltip="編輯"
                (onClick)="edit(partner)"
              />
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                pTooltip="刪除"
                (onClick)="remove(partner)"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="empty">查無資料</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Filter drawer -->
<p-drawer
  [visible]="filterOpen()"
  (visibleChange)="filterOpen.set($event)"
  position="right"
  header="搜尋條件"
  [style]="{ width: '24rem' }"
>
  <div class="filter-form">
    <div class="field">
      <label for="keyword">關鍵字</label>
      <input
        id="keyword"
        type="text"
        pInputText
        [(ngModel)]="filter.keyword"
        placeholder="名稱 / 關鍵字 / 顯示名稱"
      />
    </div>
    <div class="filter-actions">
      <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilter()" />
      <p-button label="查詢" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </div>
</p-drawer>
