<button type="button" class="row-audit-badge" (click)="open()" title="檢視完整異動紀錄">
  <i class="pi pi-history" aria-hidden="true"></i>
  <span class="badge-label">異動紀錄 History</span>
  @if (latest(); as l) {
    <span class="badge-latest">
      {{ l.actionType }} by {{ l.userName }} · {{ l.dateTime | date: 'yyyy-MM-dd HH:mm' }}
    </span>
  } @else {
    <span class="badge-latest badge-empty">尚無紀錄 No history</span>
  }
</button>

<p-dialog
  header="異動紀錄 History"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '52rem', maxWidth: '95vw' }"
>
  @if (entries().length) {
    <table class="audit-table">
      <thead>
        <tr>
          <th>時間 Time</th>
          <th>使用者 User</th>
          <th>動作 Action</th>
          <th>說明 Description</th>
        </tr>
      </thead>
      <tbody>
        @for (entry of entries(); track $index) {
          <tr>
            <td class="nowrap">{{ entry.dateTime | date: 'yyyy-MM-dd HH:mm:ss' }}</td>
            <td>{{ entry.userName }}</td>
            <td>
              <p-tag
                [value]="entry.actionType"
                [severity]="
                  entry.actionType === 'Insert'
                    ? 'success'
                    : entry.actionType === 'Delete'
                      ? 'danger'
                      : 'info'
                "
              />
            </td>
            <td class="desc">{{ entry.actionDesc || '—' }}</td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p class="empty-state">此筆資料尚無異動紀錄 No history yet.</p>
  }
</p-dialog>
